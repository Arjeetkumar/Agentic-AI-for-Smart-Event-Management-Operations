{% extends "base.html" %}{% block title %}{{ 'Edit' if incident else 'Report' }} Incident — EventOps AI{% endblock %}{% block content %}<div class="page-header"><h1>{{ 'Edit' if incident else 'Report' }} incident</h1></div><form method="post" class="card p-4 col-lg-8"><label class="form-label">Title</label><input name="title" class="form-control mb-3" required value="{{ incident.title if incident else '' }}"><label class="form-label">Description</label><textarea name="description" class="form-control mb-3">{{ incident.description if incident else '' }}</textarea><label class="form-label">Priority</label><select name="priority" class="form-select mb-3">{% for value in ['low','medium','high','critical'] %}<option {{ 'selected' if incident and incident.priority == value else '' }}>{{ value }}</option>{% endfor %}</select>{% if incident %}<label class="form-label">Status</label><select name="status" class="form-select mb-3">{% for value in ['open','in_progress','resolved'] %}<option {{ 'selected' if incident.status == value else '' }}>{{ value }}</option>{% endfor %}</select>{% endif %}<button class="btn btn-primary">Save incident</button></form>{% endblock %}
