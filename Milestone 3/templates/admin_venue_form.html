{% extends "base.html" %}{% block title %}{{ 'Edit' if venue else 'Add' }} Venue — EventOps AI{% endblock %}{% block content %}<div class="page-header"><h1>{{ 'Edit' if venue else 'Add' }} venue</h1></div><form method="post" class="card p-4 col-lg-7"><label class="form-label">Name</label><input name="name" class="form-control mb-3" required value="{{ venue.name if venue else '' }}"><label class="form-label">Capacity</label><input name="capacity" type="number" min="1" class="form-control mb-3" value="{{ venue.capacity if venue else '' }}"><label class="form-label">Utilization (0 to 1)</label><input name="utilization" type="number" min="0" max="1" step="0.01" class="form-control mb-3" value="{{ venue.utilization if venue else 0 }}"><label class="form-label">Status</label><select name="status" class="form-select mb-3">{% for status in ['available','reserved','maintenance'] %}<option {{ 'selected' if venue and venue.status == status else '' }}>{{ status }}</option>{% endfor %}</select><button class="btn btn-primary">Save venue</button></form>{% endblock %}
