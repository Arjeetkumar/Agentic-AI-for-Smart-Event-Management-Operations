{% extends "base.html" %}{% block title %}{{ 'Edit' if sponsorship else 'Add' }} Sponsorship — EventOps AI{% endblock %}{% block content %}<div class="page-header"><h1>{{ 'Edit' if sponsorship else 'Add' }} sponsorship</h1></div><form method="post" class="card p-4 col-lg-8"><label class="form-label">Sponsor name</label><input name="sponsor_name" class="form-control mb-3" required value="{{ sponsorship.sponsor_name if sponsorship else '' }}"><label class="form-label">Commitment</label><input name="commitment" class="form-control mb-3" value="{{ sponsorship.commitment if sponsorship else '' }}"><label class="form-label">Deliverables</label><input name="deliverables" class="form-control mb-3" value="{{ sponsorship.deliverables if sponsorship else '' }}"><div class="row"><div class="col"><label class="form-label">Visibility score</label><input name="visibility_score" type="number" min="0" max="100" class="form-control mb-3" value="{{ sponsorship.visibility_score if sponsorship else 0 }}"></div><div class="col"><label class="form-label">ROI</label><input name="roi" type="number" min="0" step="0.1" class="form-control mb-3" value="{{ sponsorship.roi if sponsorship else 0 }}"></div></div><button class="btn btn-primary">Save sponsorship</button></form>{% endblock %}
