{% extends "base.html" %}{% block title %}{{ 'Edit' if speaker else 'Add' }} Speaker — EventOps AI{% endblock %}{% block content %}<div class="page-header"><h1>{{ 'Edit' if speaker else 'Add' }} speaker</h1></div><form method="post" class="card p-4 col-lg-8"><label class="form-label">Name</label><input name="name" class="form-control mb-3" required value="{{ speaker.name if speaker else '' }}"><label class="form-label">Bio</label><textarea name="bio" class="form-control mb-3">{{ speaker.bio if speaker else '' }}</textarea><label class="form-label">Session title</label><input name="session_title" class="form-control mb-3" value="{{ speaker.session_title if speaker else '' }}"><label class="form-label">Schedule</label><input name="schedule" class="form-control mb-3" value="{{ speaker.schedule if speaker else '' }}"><div class="form-check mb-3"><input class="form-check-input" type="checkbox" name="availability" value="true" {{ 'checked' if not speaker or speaker.availability else '' }}><label class="form-check-label">Available</label></div><button class="btn btn-primary">Save speaker</button></form>{% endblock %}
