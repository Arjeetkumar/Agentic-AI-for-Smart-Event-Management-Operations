{% extends "base.html" %}{% block title %}Send Notification — EventOps AI{% endblock %}{% block content %}<div class="page-header"><h1>Send notification</h1></div><form method="post" class="card p-4 col-lg-8"><label class="form-label">Recipient</label><input name="recipient" type="email" class="form-control mb-3" required><label class="form-label">Channel</label><select name="channel" class="form-select mb-3"><option>in_app</option><option>email</option><option>sms</option></select><label class="form-label">Subject</label><input name="subject" class="form-control mb-3" required><label class="form-label">Message</label><textarea name="message" class="form-control mb-3" rows="5" required></textarea><button class="btn btn-primary">Save notification</button></form>{% endblock %}
