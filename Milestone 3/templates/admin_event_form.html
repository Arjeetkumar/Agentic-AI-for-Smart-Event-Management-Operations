{% extends "base.html" %}{% block title %}{{ 'Edit' if event else 'Add' }} Event — EventOps AI{% endblock %}{% block content %}
<div class="page-header"><h1>{{ 'Edit' if event else 'Add' }} event</h1></div><form method="post" class="card p-4"><div class="row g-3"><div class="col-md-8"><label class="form-label">Title</label><input name="title" class="form-control" required value="{{ event.title if event else '' }}"></div><div class="col-md-4"><label class="form-label">Capacity</label><input name="capacity" type="number" min="1" class="form-control" value="{{ event.capacity if event and event.capacity else '' }}"></div><div class="col-md-6"><label class="form-label">Date</label><input name="date" type="date" class="form-control" value="{{ event.date if event else '' }}"></div><div class="col-md-6"><label class="form-label">Time</label><input name="time" class="form-control" value="{{ event.time if event else '' }}"></div><div class="col-md-6"><label class="form-label">Location</label><input name="location" class="form-control" value="{{ event.location if event else '' }}"></div><div class="col-md-6"><label class="form-label">Status</label><select name="status" class="form-select">{% for status in ['upcoming','ongoing','completed','cancelled'] %}<option {{ 'selected' if event and event.status == status else '' }}>{{ status }}</option>{% endfor %}</select></div><div class="col-12"><label class="form-label">Description</label><textarea name="description" class="form-control" rows="4">{{ event.description if event else '' }}</textarea></div></div><div class="mt-4"><button class="btn btn-primary">Save event</button> <a class="btn btn-outline-secondary" href="{{ url_for('admin_events') }}">Cancel</a></div></form>{% endblock %}
